# Application Name
spring:
  application:
    name: TaskFlow

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:file:./data/taskflowdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Enable H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console